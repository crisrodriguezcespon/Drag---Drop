<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="estilos.css">
    <title>Drag & Drop</title>
</head>
<body>
    <header class="encabezado">
        <h1 class="encabezado-titulo">Test de informática</h1>
        <h2 class="encabezado-subtitulo">Mueve cada imagen a su caja correspondiente</h2>
    </header>
    <main class="contenedor">
        <div class="disponibles">
            <div class="contenedor-icono">
                <img src="images/i1.png" alt="altavoz" class="icono">
            </div>
            <div class="contenedor-icono">
                <img src="images/i2.png" alt="impresora" class="icono">
            </div>
            <div class="contenedor-icono">
                <img src="images/i3.png" alt="monitor" class="icono">
            </div>
            <div class="contenedor-icono">
                <img src="images/i4.png" alt="mando" class="icono">
            </div>
            <div class="contenedor-icono">
                <img src="images/i5.png" alt="ratón" class="icono">
            </div>
            <div class="contenedor-icono">
                <img src="images/i6.png" alt="teclado" class="icono">
            </div>
            <div class="contenedor-icono">
                <img src="images/i7.png" alt="cámara" class="icono">
            </div>
            <div class="contenedor-icono">
                <img src="images/i8.png" alt="escáner" class="icono">
            </div>
            <div class="contenedor-icono">
                <img src="images/i9.png" alt="pistola escáner" class="icono">
            </div>
            <div class="contenedor-icono">
                <img src="images/i10.png" alt="gafas virtuales" class="icono">
            </div>
            <div class="contenedor-icono">
                <img src="images/i11.png" alt="micrófono" class="icono">
            </div>
            <div class="contenedor-icono">
                <img src="images/i12.png" alt="proyector" class="icono">
            </div>
        </div>
        <div class="contenedor-es">
            <div class="entrada">
                <h3>Dispositivos de entrada</h3>
            </div>
            <div class="salida">
                <h3>Dispositivos de salida</h3>
            </div>
        </div>
        <footer class="pie">
            <progress class="progreso" id="progreso" value="0" min="1" max="12"></progress>
            <p class="aciertos">Aciertos: <span class="aciertos">0</span></p>
        </footer>
    </main>
</body>
</html>
